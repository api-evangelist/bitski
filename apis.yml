aid: bitski
name: Bitski
description: >-
  Bitski is a Web3 wallet-as-a-service (WaaS) and NFT infrastructure provider
  that lets developers embed secure, hardware-backed crypto wallets and
  onboarding into web and mobile applications without users installing an
  extension. Its platform spans OAuth2/OIDC authentication, wallet creation
  (account-abstraction, hardware-backed, on-chain multi-sig, and seed-phrase
  import), and a suite of NFT Service APIs for minting, commerce (credit card,
  ACH, and crypto checkout), token gating, droplinks, auctions, and wallet
  experience data (balances, activity, portfolio, floor prices). Bitski
  publishes REST OpenAPI specs served from api.bitski.com, JavaScript/React and
  iOS SDKs, activity webhooks, and node infrastructure for EVM chains. Backed by
  a16z and Kindred Ventures.
